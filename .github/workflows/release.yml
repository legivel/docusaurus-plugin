# Publishes docusaurus-plugin-legivel to npm when a version tag is pushed.
# The tag must equal "v" + the version in package.json. npm trusted publishing
# accepts this workflow through OIDC (id-token: write), so no npm token exists;
# the package's trusted publisher on npmjs.com must name this repository and
# release.yml. Trusted publishing needs npm 11.5.1 or newer and adds provenance.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - run: npm install --global npm@11.6.2

      - name: Publish through trusted publishing
        run: npm publish --access public
